name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  release:
    uses: under-tree-e/ute-ci-templates/.github/workflows/node-container-release.yml@v1
    with:
      image-name: YOUR_ORG/YOUR_SERVICE
      working-directory: src
